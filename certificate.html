<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Certificate Generator | CSV Edge Academy</title>

  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="main.css">

  <style>
    body{
      background:#eef2f7;
      font-family:Arial, Helvetica, sans-serif;
    }
    .cert-wrapper{
      max-width:800px;
      margin:50px auto;
      background:#ffffff;
      padding:30px;
      border-radius:18px;
      box-shadow:0 14px 35px rgba(0,0,0,.12);
    }
    button{
      padding:10px 18px;
      border:none;
      border-radius:25px;
      background:#0f4c81;
      color:white;
      cursor:pointer;
      margin-top:15px;
    }
    input{
      width:100%;
      padding:10px;
      margin:8px 0;
    }
  </style>
</head>

<body>

<div class="cert-wrapper">

<h2 style="text-align:center;color:#0f4c81;">📜 Certificate Generator</h2>

<label><strong>Student Name</strong></label>
<input id="studentName" placeholder="Enter full name exactly as required">

<label><strong>Course / Program Name</strong></label>
<input id="courseName" placeholder="Enter course name">

<label><strong>Date of Completion</strong></label>
<input id="completionDate" placeholder="e.g. 21 January 2026">

<label><strong>Password</strong></label>
<input id="dailyPassword" placeholder="XXXX">

<button onclick="validateAndGenerate()">⬇️ Generate Certificate</button>

</div>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
/* ================= PASSWORD LOGIC ================= */
function getTodayPassword(){
  const d = new Date();
  return String(d.getDate()).padStart(2,'0') +
         String(d.getMonth()+1).padStart(2,'0') +
         d.getFullYear();
}

/* ================= VALIDATION ================= */
function validateAndGenerate(){
  const name = studentName.value.trim();
  const course = courseName.value.trim();
  const date = completionDate.value.trim();
  const enteredPassword = dailyPassword.value.trim();

  if(name.length < 2 || course.length < 3 || date.length < 4){
    alert("Please fill all fields correctly");
    return;
  }

  if(enteredPassword !== getTodayPassword()){
    alert("❌ Invalid password.");
    return;
  }

  generateCertificate(name, course, date);
}

/* ================= CERTIFICATE ================= */
let academyLogoBase64 = null;

function loadAcademyLogo(cb){
  if(academyLogoBase64){ cb(academyLogoBase64); return; }

  const img = new Image();
  img.src = "assets/images/logo.png";
  img.crossOrigin = "anonymous";

  img.onload = ()=>{
    const c=document.createElement("canvas");
    c.width=img.width; c.height=img.height;
    c.getContext("2d").drawImage(img,0,0);
    academyLogoBase64=c.toDataURL("image/png");
    cb(academyLogoBase64);
  };
}

function generateCertificate(name, course, date){

  loadAcademyLogo((logo)=>{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("landscape");

    /* ===== BORDERS ===== */
    doc.setDrawColor(212,175,55);
    doc.setLineWidth(5);
    doc.rect(10,10,277,190);

    doc.setDrawColor(15,76,129);
    doc.setLineWidth(1.5);
    doc.rect(16,16,265,178);

    /* ===== WATERMARK ===== */
    if(doc.setGState){
      doc.setGState(new doc.GState({opacity:0.08}));
    }
    doc.addImage(logo,"PNG",70,60,160,90);
    if(doc.setGState){
      doc.setGState(new doc.GState({opacity:1}));
    }

    /* ===== LOGO ===== */
    doc.addImage(logo,"PNG",20,20,40,20);

    /* ===== TITLE ===== */
    doc.setFont("helvetica","bold");
    doc.setFontSize(30);
    doc.setTextColor(212,175,55);
    doc.text("CERTIFICATE OF COMPLETION",148,45,{align:"center"});

    /* ===== BODY ===== */
    doc.setFont("helvetica","normal");
    doc.setFontSize(16);
    doc.setTextColor(0,0,0);
    doc.text("This is to certify that",148,66,{align:"center"});

    /* ===== STUDENT NAME (HANDWRITTEN STYLE) ===== */
    doc.setFont("times","italic");
    doc.setFontSize(30);
    doc.setTextColor(15,76,129);
    doc.text(name,148,88,{align:"center"});

    /* ===== COURSE TEXT ===== */
    doc.setFont("helvetica","normal");
    doc.setFontSize(18);
    doc.setTextColor(0,0,0);
    doc.text(
      `has successfully completed the professional ${course}`,
      148,
      106,
      { align:"center", maxWidth:230 }
    );

    doc.setFontSize(17);
    doc.text("conducted by CSV Edge Academy",148,122,{align:"center"});

    doc.setFontSize(14);
    doc.text(`Date of Completion: ${date}`,148,138,{align:"center"});

    /* ===== CERT ID ===== */
    const certId = "CSV-" + Date.now();
    doc.setFontSize(11);
    doc.text(`Certificate ID: ${certId}`,30,168);

    /* ===== SEAL ===== */
    doc.setDrawColor(212,175,55);
    doc.setLineWidth(3);
    doc.circle(148,165,18);
    doc.setFontSize(10);
    doc.setTextColor(212,175,55);
    doc.text("WORKSHOP\nPARTICIPANT",148,162,{align:"center"});

    /* ===== SIGNATURE ===== */
    doc.setFont("times","italic");
    doc.setFontSize(16);
    doc.setTextColor(0,0,0);
    doc.text("Authorized Signatory",235,150,{align:"center"});
    doc.setFont("helvetica","normal");
    doc.setFontSize(11);
    doc.text("CSV Edge Academy",235,160,{align:"center"});

    /* ===== THANK YOU NOTE ===== */
    doc.setFontSize(11);
    doc.setTextColor(55,65,81);
    doc.text(
      "Thank you for being part of our learning journey. We wish you continued success in your professional career.",
      148,
      178,
      { align:"center", maxWidth:260 }
    );

    /* ===== QR CODE ===== */
    const qrDiv=document.createElement("div");
    new QRCode(qrDiv,{
      text:"https://csvedgeacademy.github.io",
      width:100,
      height:100
    });

    setTimeout(()=>{
      doc.addImage(qrDiv.querySelector("img").src,"PNG",235,20,35,35);
      doc.text("Scan to Verify",252,60,{align:"center"});
      doc.save(`Certificate_${name}.pdf`);
    },500);
  });
}
</script>

</body>
</html>
