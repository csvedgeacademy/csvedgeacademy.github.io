<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Certificate Generator | CSV Edge Academy</title>

  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="main.css">

  <style>
    body{
      background:#eef2f7;
      font-family:Arial, Helvetica, sans-serif;
    }
    .cert-wrapper{
      max-width:800px;
      margin:50px auto;
      background:#ffffff;
      padding:30px;
      border-radius:18px;
      box-shadow:0 14px 35px rgba(0,0,0,.12);
    }
    button{
      padding:10px 18px;
      border:none;
      border-radius:25px;
      background:#0f4c81;
      color:white;
      cursor:pointer;
      margin-top:15px;
    }
    input{
      width:100%;
      padding:10px;
      margin:8px 0;
    }
    .hint{
      font-size:13px;
      color:#64748b;
      margin-top:6px;
    }
  </style>
</head>

<body>

<div class="cert-wrapper">

<h2 style="text-align:center;color:#0f4c81;">📜 Certificate Generator</h2>

<label><strong>Student Name</strong></label>
<input id="studentName" placeholder="Enter full name exactly as required">

<label><strong>Course / Program Name</strong></label>
<input id="courseName" placeholder="Enter course name">

<label><strong>Date of Completion</strong></label>
<input id="completionDate" placeholder="e.g. 21 January 2026">

<label><strong>Daily Password</strong></label>
<input id="dailyPassword" placeholder="DDMMYYYY">

<div class="hint">
Password = Today’s date (DDMMYYYY). Changes daily.
</div>

<button onclick="validateAndGenerate()">⬇️ Generate Certificate</button>

</div>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
/* ================= PASSWORD LOGIC ================= */
function getTodayPassword(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return dd + mm + yyyy;
}

/* ================= VALIDATION ================= */
function validateAndGenerate(){
  const name = studentName.value.trim();
  const course = courseName.value.trim();
  const date = completionDate.value.trim();
  const enteredPassword = dailyPassword.value.trim();

  if(name.length < 2 || course.length < 3 || date.length < 4){
    alert("Please fill all fields correctly");
    return;
  }

  if(enteredPassword !== getTodayPassword()){
    alert("❌ Invalid password. Use today's date (DDMMYYYY).");
    return;
  }

  generateCertificate(name, course, date);
}

/* ================= CERTIFICATE ================= */
let academyLogoBase64 = null;

function loadAcademyLogo(cb){
  if(academyLogoBase64){ cb(academyLogoBase64); return; }

  const img = new Image();
  img.src = "assets/images/logo.png";
  img.crossOrigin = "anonymous";

  img.onload = ()=>{
    const c=document.createElement("canvas");
    c.width=img.width; c.height=img.height;
    c.getContext("2d").drawImage(img,0,0);
    academyLogoBase64=c.toDataURL("image/png");
    cb(academyLogoBase64);
  };
}

function generateCertificate(name, course, date){

  loadAcademyLogo((logo)=>{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("landscape");

    /* ================= COLORS ================= */
    const GOLD = [212,175,55];
    const NAVY = [15,76,129];

    /* ================= OUTER FRAME ================= */
    doc.setDrawColor(...GOLD);
    doc.setLineWidth(6);
    doc.rect(8,8,281,194);

    doc.setDrawColor(...NAVY);
    doc.setLineWidth(1.5);
    doc.rect(16,16,265,178);

    /* ================= WATERMARK ================= */
    if(doc.setGState){
      doc.setGState(new doc.GState({opacity:0.06}));
    }
    doc.addImage(logo,"PNG",70,55,160,95);
    if(doc.setGState){
      doc.setGState(new doc.GState({opacity:1}));
    }

    /* ================= HEADER BAND ================= */
    doc.setFillColor(245,247,250);
    doc.rect(16,16,265,28,"F");

    doc.addImage(logo,"PNG",24,20,36,18);

    doc.setFont("helvetica","bold");
    doc.setFontSize(16);
    doc.setTextColor(...NAVY);
    doc.text("CSV EDGE ACADEMY",148,30,{align:"center"});

    /* ================= TITLE ================= */
    doc.setFontSize(32);
    doc.setTextColor(...GOLD);
    doc.text("CERTIFICATE OF COMPLETION",148,55,{align:"center"});

    /* ================= BODY ================= */
    doc.setTextColor(0,0,0);
    doc.setFontSize(16);
    doc.setFont("helvetica","normal");
    doc.text("This is to certify that",148,72,{align:"center"});

    doc.setFont("helvetica","bold");
    doc.setFontSize(28);
    doc.text(name,148,92,{align:"center"});

    doc.setFont("helvetica","normal");
    doc.setFontSize(16);
    doc.text("has successfully completed the professional program",148,110,{align:"center"});

    doc.setFont("helvetica","bold");
    doc.setFontSize(20);
    doc.setTextColor(...GOLD);
    doc.text(course,148,126,{align:"center"});

    doc.setFont("helvetica","normal");
    doc.setFontSize(14);
    doc.setTextColor(0,0,0);
    doc.text(`Date of Completion: ${date}`,148,142,{align:"center"});

    /* ================= CERT ID ================= */
    const certId = "CSV-" + Date.now();
    doc.setFontSize(11);
    doc.text(`Certificate ID: ${certId}`,26,165);

    /* ================= GOLD SEAL ================= */
    doc.setDrawColor(...GOLD);
    doc.setLineWidth(3);
    doc.circle(148,160,18);
    doc.setLineWidth(1);
    doc.circle(148,160,14);

    doc.setFont("helvetica","bold");
    doc.setFontSize(10);
    doc.setTextColor(...GOLD);
    doc.text("OFFICIALLY\nCERTIFIED",148,158,{align:"center"});

    /* ================= SIGNATURE ================= */
    doc.setFont("times","italic");
    doc.setFontSize(16);
    doc.setTextColor(0,0,0);
    doc.text("Authorized Signatory",240,150,{align:"center"});

    doc.setFont("helvetica","normal");
    doc.setFontSize(11);
    doc.text("CSV Edge Academy",240,160,{align:"center"});

    /* ================= QR CODE ================= */
    const qrDiv = document.createElement("div");
    new QRCode(qrDiv,{
      text:"https://csvedgeacademy.github.io",
      width:100,
      height:100
    });

    setTimeout(()=>{
      doc.addImage(qrDiv.querySelector("img").src,"PNG",232,28,36,36);
      doc.setFontSize(9);
      doc.text("Scan to Verify",250,70,{align:"center"});
      doc.save(`Certificate_${name}.pdf`);
    },500);
  });
}
</script>


</script>

</body>
</html>
