<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSV Program | Computerized System Validation Training</title>

<meta name="description"
content="Explore the complete Computerized System Validation (CSV) Program by CSV Edge Academy including About, Curriculum, Pricing and Certification.">

<meta name="robots" content="index, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- HTML2CANVAS (for download) -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
:root{
  --dark:#0f172a;
  --accent:#d4af37;
  --muted:#94a3b8;
  --bg:#020617;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#111;
  padding:30px;
}

/* ===== POSTER ===== */
#poster{
  max-width:1200px;
  margin:auto;
  background:linear-gradient(135deg,var(--dark),var(--bg));
  color:#fff;
  border-radius:24px;
  padding:60px;
  box-shadow:0 40px 100px rgba(0,0,0,.6);
  animation:fadeIn 1.2s ease;
}

.hero{
  text-align:center;
}

.hero h1{
  font-size:clamp(36px,5vw,52px);
  color:var(--accent);
  margin-bottom:10px;
}

.hero h2{
  font-size:22px;
  font-weight:500;
}

.hero p{
  max-width:800px;
  margin:12px auto;
  color:var(--muted);
}

.section{
  margin-top:40px;
}

.section h3{
  color:var(--accent);
  margin-bottom:14px;
}

ul{
  padding-left:20px;
}

ul li{
  margin-bottom:8px;
  color:#e5e7eb;
}

/* ===== PRICING ===== */
.price-box{
  background:rgba(255,255,255,.05);
  padding:30px;
  border-radius:18px;
  text-align:center;
}

.price{
  font-size:44px;
  font-weight:700;
  color:var(--accent);
}

/* ===== BUTTONS ===== */
.buttons{
  margin-top:30px;
  text-align:center;
}

.buttons a{
  display:inline-block;
  margin:8px;
  padding:14px 28px;
  border-radius:12px;
  font-weight:600;
  text-decoration:none;
}

.btn-primary{
  background:var(--accent);
  color:#000;
}

.btn-secondary{
  border:1px solid var(--accent);
  color:var(--accent);
}

/* ===== DOWNLOAD ===== */
.download{
  margin-top:40px;
  display:block;
  background:#fff;
  color:#000;
  padding:14px 24px;
  border-radius:10px;
  border:none;
  font-weight:600;
  cursor:pointer;
  margin-left:auto;
  margin-right:auto;
}

/* ===== FOOTER ===== */
footer{
  margin-top:40px;
  text-align:center;
  font-size:14px;
  color:var(--muted);
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div id="poster">

  <div class="hero">
    <h2 data-key="academyName"></h2>
    <h1 data-key="headline"></h1>
    <h2 data-key="subHeadline"></h2>
    <p data-key="tagline"></p>
    <p><strong data-key="industries"></strong></p>
    <p data-key="schedule"></p>
  </div>

  <div class="section">
    <h3>Ideal For</h3>
    <ul id="idealFor"></ul>
  </div>

  <div class="section">
    <h3>Program Highlights</h3>
    <ul id="features"></ul>
  </div>

  <div class="section price-box">
    <div class="price" data-key="price"></div>
    <p data-key="batch"></p>
    <p><strong data-key="trust"></strong></p>
  </div>

  <div class="buttons">
    <a class="btn-primary" data-link="enroll" target="_blank">Enroll Now</a>
    <a class="btn-secondary" data-link="whatsapp" target="_blank">WhatsApp</a>
    <a class="btn-secondary" data-link="email">Email</a>
    <a class="btn-secondary" data-link="linkedin" target="_blank">LinkedIn</a>
  </div>

  <button class="download" onclick="downloadPoster()">Download Poster</button>

  <footer>
    © CSV Edge Academy • Industry-Aligned CSV & GxP Training
  </footer>

</div>

<script>
/* ===== EDIT EVERYTHING HERE ===== */
const POSTER_DATA = {
  academyName:"CSV Edge Academy",
  headline:"Computerized System Validation (CSV)",
  subHeadline:"Online Industry-Focused Certification Program",
  tagline:"From Fresher to Industry-Ready CSV Professional",
  industries:"Pharmaceutical • Life Sciences • Biotech • Medical Devices • IT",
  schedule:"Live Sessions | Mon–Fri | 08:00–09:00 PM (IST)",

  idealFor:[
    "Freshers entering Pharma / IT Validation",
    "QA, QC, RA, CSV & IT Professionals",
    "Life Sciences professionals strengthening GxP expertise"
  ],

  features:[
    "Hands-on real validation documents",
    "One-to-one query resolution",
    "Daily assessments",
    "Mock interviews & resume preparation",
    "Free Jira Software Training"
  ],

  price:"₹7,999",
  batch:"April 2026 Batch",
  trust:"Aligned with GAMP 5 & FDA Expectations",

  links:{
    enroll:"https://csvedgeacademy.github.io/contact.html",
    whatsapp:"https://api.whatsapp.com/send/?phone=9665942334",
    email:"mailto:csvedgeacademy@gmail.com",
    linkedin:"https://www.linkedin.com/company/111385921/admin/dashboard/"
  }
};

/* ===== POPULATE DATA ===== */
document.querySelectorAll("[data-key]").forEach(el=>{
  el.innerText=POSTER_DATA[el.dataset.key];
});

POSTER_DATA.idealFor.forEach(i=>{
  document.getElementById("idealFor").innerHTML+=`<li>${i}</li>`;
});

POSTER_DATA.features.forEach(f=>{
  document.getElementById("features").innerHTML+=`<li>${f}</li>`;
});

document.querySelectorAll("[data-link]").forEach(a=>{
  a.href=POSTER_DATA.links[a.dataset.link];
});

/* ===== DOWNLOAD POSTER ===== */
function downloadPoster(){
  html2canvas(document.getElementById("poster")).then(canvas=>{
    const link=document.createElement("a");
    link.download="CSV_Edge_Academy_Poster.png";
    link.href=canvas.toDataURL();
    link.click();
  });
}
</script>

</body>
</html>
